# CI for the RcLights Arduino library.
#
# Five stages, fastest to slowest:
#
#   lint     Formatting, whitespace, static analysis and the check that every
#            place carrying a version names the same one.
#   test     Host unit tests from tests/ -- plain gcc, no target platform, runs
#            in seconds. This is where the library's entire logic sits: what the
#            lights do is decided by src/rclights_core.c, and that needs no
#            board.
#   build    Compile the examples for Nano, Nucleo and ESP32.
#   docs     Doxygen. The Doxyfile has WARN_AS_ERROR = FAIL_ON_WARNINGS, so the
#            job fails as soon as a public declaration is undocumented or an
#            @param no longer matches the signature.
#   release  Turns an annotated tag into a GitLab release object.
#
# Unlike arduino_crsf there is a build stage here, and it is not optional: this
# library has a target platform, three of them in fact. The part that differs
# between them -- the pulse capture and the PWM output -- is exactly the part
# the host tests cannot cover, because on AVR it consists of custom pin-change
# interrupts and on ESP32 of LEDC. Only a compiler for the target in question
# can say whether it builds.

stages:
  - lint
  - test
  - build
  - docs
  - release

variables:
  # Shallow clone, which is enough for everything here.
  GIT_DEPTH: "20"

# No duplicate pipelines: with a merge request open, only the MR pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

# --- lint ---------------------------------------------------------------------

# Formatting and static analysis.
#
# The image is pinned to a major version because clang-format's output changes
# between them: a different one here than locally makes this job red for a
# reason nobody can reproduce.
#
# The job calls tools/ci.sh rather than the tools directly, so there is only one
# implementation of each check. --strict turns a missing tool into a failure,
# because a silently skipped lint is worthless in CI.
lint:
  stage: lint
  image: silkeh/clang:20
  before_script:
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
  script:
    - bash tools/ci.sh lint --strict

# A version is written in three places; all three have to say the same thing.
#
#   release_X.Y.Z          -> VERSION: X.Y.Z
#   prerelease_X.Y.Z_dev   -> VERSION: X.Y.Z-dev
#
# The tag is a git reference and may look how it likes; the version may not,
# since semver attaches a pre-release marker with a hyphen.
#
# "Tagged as X, the file still says Y" is the classic release mistake, and it
# surfaces only once somebody pulls the library.
version-matches-tag:
  stage: lint
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu

      # X.Y.Z: three components, all purely numeric, nothing after them.
      is_core() {
        IFS=. read -r a b c extra <<INNER
      $1
      INNER
        [ -n "$a" ] && [ -n "$b" ] && [ -n "$c" ] && [ -z "$extra" ] || return 1
        for n in "$a" "$b" "$c"; do
          case "$n" in ""|*[!0-9]*) return 1 ;; esac
        done
      }

      tag=$CI_COMMIT_TAG
      case "$tag" in
        release_*)
          core=${tag#release_}
          want=$core
          ;;
        prerelease_*)
          core=${tag#prerelease_}
          core=${core%_dev}
          [ "$tag" = "prerelease_${core}_dev" ] || {
            echo "Tag '$tag': expected prerelease_X.Y.Z_dev"; exit 1; }
          want="$core-dev"
          ;;
        *)
          echo "Tag '$tag' matches no scheme."
          echo "Allowed: release_X.Y.Z or prerelease_X.Y.Z_dev"
          exit 1
          ;;
      esac
      is_core "$core" || {
        echo "Tag '$tag': X.Y.Z must be three numbers, read '$core'"
        exit 1; }

      fail=0
      check() {  # name, value read
        echo "  $1: $2"
        [ "$2" = "$want" ] || { echo "    ...expected '$want'"; fail=1; }
      }

      echo "Tag:      $tag"
      echo "expected: $want"
      have_p=$(sed -n 's/^version=//p' library.properties)
      have_j=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' library.json)
      check "library.properties" "$have_p"
      check "library.json      " "$have_j"
      check "Doxyfile          " "$(sed -n 's/^PROJECT_NUMBER *= *//p' Doxyfile | tr -d '"[:space:]')"
      [ "$fail" -eq 0 ] || { echo; echo "Version and tag disagree."; exit 1; }
      echo "Every version matches the tag."

# arduino-lint checks library.properties, the src/ layout and the
# examples/<Name>/<Name>.ino rule: the things that break quietly.
#
# LIBRARY_MANAGER_MODE has to be changed once, by hand, when the library is
# accepted into the registry. The two modes check opposite things:
#
#   submit   Not in the index yet. LP017 fails if the name is already taken,
#            which is the likeliest reason a submission is turned away.
#   update   In the index. LP018 fails if the name is *not* found, catching a
#            rename the registry does not allow, and --compliance strict
#            promotes LP022 (tag ahead of the version field) to an error.
#
# Left on submit after acceptance, LP017 fires against our own index entry.
#
# The job calls tools/ci.sh, which lints a copy of the tracked files rather than
# the checkout: rule LS007 fails on any .exe, and build_tests/ is full of them
# on a Windows machine.
arduino-lint:
  stage: lint
  image: debian:bookworm-slim
  variables:
    LIBRARY_MANAGER_MODE: submit
  before_script:
    - apt-get update -qq
    # git and tar: ci.sh copies the tracked files out with them.
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git tar
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-lint/main/etc/install.sh | BINDIR=/usr/local/bin sh
  script:
    - bash tools/ci.sh arduino-lint --strict

# --- test ---------------------------------------------------------------------

# The suites from tests/Makefile. -Werror is already set there, so a warning
# breaks the build in any case.
unit-tests:
  stage: test
  image: gcc:14
  script:
    - mkdir -p build_tests
    - make -C tests > build_tests/test-output.txt 2>&1 || true
    - cat build_tests/test-output.txt
    - bash tools/junit_from_tests.sh build_tests/test-output.txt > build_tests/junit.xml
    - grep -q "All .* suites passed" build_tests/test-output.txt
  artifacts:
    when: always
    paths:
      - build_tests/
    reports:
      junit: build_tests/junit.xml
    expire_in: 1 week

# An overflow or a read next to an array only shows up under the sanitizers.
# Cygwin has no libasan, which is why this is a target of its own.
unit-tests-sanitized:
  stage: test
  image: gcc:14
  variables:
    ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  script:
    - make -C tests sanitize

# --- build --------------------------------------------------------------------

# Compile the examples for the three platforms library.properties names.
#
# --library . builds against the working tree, without installing into a
# sketchbook first. --warnings more, not all: with `all` the AVR core warns in
# its own headers. The cache matters because the esp32 core is around 250 MB.
#
# The AVR entry is the important one: it is the only place the pin-change path
# in RcLights.cpp is compiled at all.
build-examples:
  stage: build
  image: debian:bookworm-slim
  variables:
    ARDUINO_DIRECTORIES_DATA: $CI_PROJECT_DIR/.arduino15
    ARDUINO_DIRECTORIES_DOWNLOADS: $CI_PROJECT_DIR/.arduino-dl
    ARDUINO_DIRECTORIES_USER: $CI_PROJECT_DIR/.arduino-user
  parallel:
    matrix:
      - CORE: "arduino:avr"
        FQBN: "arduino:avr:nano"
        INDEX: ""
      - CORE: "esp32:esp32"
        FQBN: "esp32:esp32:esp32doit-devkit-v1"
        INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
      - CORE: "STMicroelectronics:stm32"
        FQBN: "STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_F411RE"
        INDEX: "https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json"
  cache:
    key: "arduino-$CORE"
    paths:
      - .arduino15/
      - .arduino-dl/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git python3
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
  script:
    - arduino-cli core update-index ${INDEX:+--additional-urls "$INDEX"}
    - arduino-cli core install "$CORE" ${INDEX:+--additional-urls "$INDEX"}
    - |
      set -e
      for ex in examples/*/; do
        name=$(basename "$ex")
        echo "=== $name ($FQBN) ==="
        arduino-cli compile --fqbn "$FQBN" --library . --warnings more \
            --output-dir "build_arduino/$name" "$ex$name.ino"
      done
  artifacts:
    when: on_failure
    paths:
      - build_arduino/**/*.map
    expire_in: 1 week

# The AVR fallback path, for sketches that pull in another library using the
# same vectors. No other job compiles it, so without this a typo in it would
# first be noticed by the one user who needs it.
build-avr-no-pcint:
  stage: build
  image: debian:bookworm-slim
  variables:
    ARDUINO_DIRECTORIES_DATA: $CI_PROJECT_DIR/.arduino15
    ARDUINO_DIRECTORIES_DOWNLOADS: $CI_PROJECT_DIR/.arduino-dl
    ARDUINO_DIRECTORIES_USER: $CI_PROJECT_DIR/.arduino-user
  cache:
    key: "arduino-arduino:avr"
    paths:
      - .arduino15/
      - .arduino-dl/
    policy: pull
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates git
    - curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
  script:
    - arduino-cli core update-index
    - arduino-cli core install arduino:avr
    # One example is enough: what is being checked is the library path, not the sketch.
    - arduino-cli compile --fqbn arduino:avr:nano --library . --warnings more
        --build-property "compiler.cpp.extra_flags=-DRCLIGHTS_NO_AVR_PCINT"
        examples/RcLightsBasic/RcLightsBasic.ino

# --- docs ---------------------------------------------------------------------

doxygen:
  stage: docs
  image: alpine:3.20
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile

# GitLab Pages: publish the generated API documentation from main.
#
# Does not block the pipeline, for a reason outside this repository: the nginx
# in front of the instance accepts 1 MB per request and the public artifact is
# larger, so the upload ends in "413 Request Entity Too Large". Raising it
#
#   nginx['client_max_body_size'] = '0'   in /etc/gitlab/gitlab.rb
#   + gitlab-ctl reconfigure
#
# makes the job publish by itself, and this allow_failure can go.
pages:
  stage: docs
  image: alpine:3.20
  needs:
    - job: doxygen
      artifacts: false
  before_script:
    - apk add --no-cache doxygen
  script:
    - doxygen Doxyfile
    - mkdir -p public/docs
    - mv docs/html/* public/docs/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# --- release ------------------------------------------------------------------

# Turns an annotated tag into a GitLab release object.
#
# The description comes from CHANGELOG.md, not the tag message: the changelog is
# reviewed in the merge request, a tag message is not.
# tools/changelog_section.py exits with an error if the section is missing, so
# you cannot tag without having written the entry.
#
# Only release_*, not prerelease_*: a release is something you install.
#
# Links rather than uploaded assets, because an upload hits the same 1 MB limit
# as pages above.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: version-matches-tag
      artifacts: false
    - job: unit-tests
      artifacts: false
    - job: arduino-lint
      artifacts: false
    - job: build-examples
      artifacts: false
    - job: doxygen
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release_[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache python3
  script:
    - python3 tools/changelog_section.py "${CI_COMMIT_TAG#release_}" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "RcLights ${CI_COMMIT_TAG#release_}"
    description: ./release_notes.md
    ref: $CI_COMMIT_SHA
    assets:
      links:
        - name: "Source (tar.gz)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tar.gz"
          link_type: package
        - name: "Source (zip)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.zip"
          link_type: package
